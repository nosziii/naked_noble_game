<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Naked Noble – Nyereményjáték</title>

  <!-- Google Fonts: DM Serif Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Brand */
      --color-primary: #173D36;
      --color-primary-hover: #24564B;
      --color-background: #FFF8EF;
      --color-surface: #F5EBDD;
      --color-surface-white: #FFFFFF;

      /* Red Start Button */
      --color-red-btn: #D92626;
      --color-red-btn-hover: #B81D1D;
      --color-red-glow: rgba(217, 38, 38, 0.38);

      /* Accent */
      --color-rose: #D98F9D;
      --color-rose-dark: #9E5E6B;
      --color-apricot: #F4AD83;
      --color-gold: #E8B951;
      --color-sage: #B7C5AC;

      /* Typography */
      --color-text: #173D36;
      --color-text-secondary: #615A54;
      --color-text-inverse: #FFFFFF;

      /* UI */
      --color-border: #E9DDD0;
      --color-slot-muted: #E7DDD0;
      --color-slot-icon: #B3A798;
      --color-overlay: rgba(18, 40, 35, 0.68);
      --color-win: #D4A53D;

      /* Shape */
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --radius-pill: 999px;

      /* Elevation */
      --shadow-card: 0 8px 28px rgba(38, 48, 39, 0.08);
      --shadow-win-glow: 0 0 0 2px var(--color-gold), 0 12px 36px rgba(232, 185, 81, 0.42);
      --shadow-button: 0 10px 24px rgba(23, 61, 54, 0.2);
      --shadow-modal: 0 24px 80px rgba(22, 42, 35, 0.24);

      /* Motion */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.22, 1.12, 0.36, 1);
      --duration-fast: 180ms;
      --duration-normal: 300ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--color-background);
      color: var(--color-text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle organic background ambient blobs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(70px);
      opacity: 0.35;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--color-rose) 0%, transparent 70%);
      top: -140px;
      left: -120px;
    }
    body::after {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, var(--color-apricot) 0%, transparent 70%);
      bottom: -160px;
      right: -120px;
    }

    /* Top Bar (Always crisp and accessible on top) */
    .top-bar {
      position: fixed;
      top: clamp(12px, 2.2vh, 24px);
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1320px;
      padding: 0 clamp(16px, 3vw, 44px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      pointer-events: none;
    }

    .brand-pill,
    .top-actions {
      pointer-events: auto;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 11px 22px;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 14px rgba(23, 61, 54, 0.14);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
    }

    .icon-btn:hover {
      background-color: #ECE0CE;
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* Main Responsive App Shell (Faded when waiting for Red Start Button) */
    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1320px;
      height: 100dvh;
      margin: 0 auto;
      padding: clamp(64px, 9vh, 92px) clamp(16px, 3vw, 44px) clamp(16px, 3vh, 32px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: opacity 420ms var(--ease-out),
                  filter 420ms var(--ease-out),
                  transform 420ms var(--ease-out);
    }

    /* Translucent / Faded Background State when Red Start Button is visible */
    .app-shell.is-awaiting-start {
      opacity: 0.28;
      filter: blur(2.5px);
      transform: scale(0.99);
      pointer-events: none;
    }

    /* Editorial Header Section */
    .hero-header {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: clamp(8px, 1.8vh, 20px);
    }

    .hero-kicker {
      font-size: clamp(11px, 1.2vw, 13px);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-rose-dark);
      margin-bottom: 4px;
    }

    .hero-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(30px, 4.2vw, 50px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--color-primary);
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: 400;
      color: var(--color-text-secondary);
    }

    /* Main Game Panel (#F5EBDD, 28px radius) */
    .game-board {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: clamp(14px, 2.2vh, 24px) clamp(14px, 2.2vw, 26px);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--color-border);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(10px, 1.8vh, 18px);
    }

    /* Top & Bottom Muted Context Rows (Gift Placeholders) */
    .context-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 20px);
      height: clamp(44px, 7vh, 68px);
      flex-shrink: 0;
    }

    .context-slot {
      background-color: var(--color-slot-muted);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-slot-icon);
      transition: opacity var(--duration-normal) var(--ease-out),
                  transform var(--duration-normal) var(--ease-out);
    }

    .context-slot svg {
      width: clamp(20px, 2.5vh, 26px);
      height: clamp(20px, 2.5vh, 26px);
      stroke-width: 1.75;
    }

    .is-spinning .context-slot {
      opacity: 0.65;
      transform: scale(0.985);
    }

    /* Center Active Product Reels Row */
    .reels-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 1.8vw, 20px);
      flex: 1;
      min-height: 0;
    }

    /* Individual Product Reel Card */
    .product-card {
      position: relative;
      background-color: var(--color-surface-white);
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-gold);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      height: 100%;
      transition: transform var(--duration-normal) var(--ease-out),
                  box-shadow var(--duration-normal) var(--ease-out),
                  border-color var(--duration-normal) var(--ease-out);
    }

    /* Winning Golden Flash & Shimmer on Center Cards (Phase 1) */
    .product-card.winning-card {
      border: 2.5px solid var(--color-gold);
      box-shadow: var(--shadow-win-glow);
      transform: translateY(-3px);
    }

    .product-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.78) 45%,
        rgba(232, 185, 81, 0.38) 50%,
        transparent 75%
      );
      transform: translateX(-130%);
      pointer-events: none;
      z-index: 5;
    }

    .product-card.winning-card::after {
      animation: cardShimmer 750ms var(--ease-out) forwards;
    }

    @keyframes cardShimmer {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }

    /* Vertical Reel Strip inside each Product Card */
    .reel-strip {
      width: 100%;
      will-change: transform, filter;
      display: flex;
      flex-direction: column;
    }

    .reel-strip.motion-blur {
      filter: blur(2px);
    }

    .reel-item {
      width: 100%;
      flex-shrink: 0;
      padding: clamp(10px, 1.8vh, 18px) clamp(10px, 1.5vw, 18px) clamp(8px, 1.4vh, 14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Inner Frame for Product Image */
    .product-image-frame {
      width: 100%;
      flex: 1;
      min-height: 0;
      background-color: #FFFFFF;
      border: 1px solid #F0EAE1;
      border-radius: 14px;
      padding: clamp(8px, 1.5vh, 16px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image-frame img {
      max-width: 92%;
      max-height: 92%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .product-name {
      margin-top: clamp(6px, 1.2vh, 12px);
      font-size: clamp(13px, 1.25vw, 16px);
      font-weight: 700;
      color: var(--color-primary);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      flex-shrink: 0;
    }

    /* =====================================================================
       FOREGROUND RED START BUTTON OVERLAY (A piros indítógomb felül)
       ===================================================================== */
    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 280ms var(--ease-out),
                  transform 280ms var(--ease-out);
    }

    .start-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
    }

    @keyframes redPulseHalo {
      0%, 100% {
        box-shadow:
          0 18px 45px var(--color-red-glow),
          0 0 0 0 rgba(217, 38, 38, 0.35),
          inset 0 2px 4px rgba(255, 255, 255, 0.35);
      }
      50% {
        box-shadow:
          0 22px 55px rgba(217, 38, 38, 0.5),
          0 0 0 18px rgba(217, 38, 38, 0),
          inset 0 2px 4px rgba(255, 255, 255, 0.35);
      }
    }

    .red-start-btn {
      position: relative;
      min-width: clamp(260px, 42vw, 420px);
      padding: clamp(22px, 3.2vh, 30px) clamp(40px, 5vw, 64px);
      border-radius: var(--radius-pill);
      background: linear-gradient(180deg, #EF3B3B 0%, var(--color-red-btn) 55%, #B91C1C 100%);
      color: #FFFFFF;
      border: 4px solid #FFF8EF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(22px, 2.8vw, 32px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      animation: redPulseHalo 2.2s infinite ease-in-out;
      transition: transform var(--duration-fast) var(--ease-out),
                  filter var(--duration-fast) var(--ease-out);
    }

    .red-start-btn:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.05);
    }

    .red-start-btn:active {
      transform: scale(0.96);
    }

    /* Winner Modal Overlay (Phase 2 & 3) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: var(--color-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-normal) var(--ease-out);
    }

    .modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Subtle Restrained Confetti Layer (8-10 elements) */
    .subtle-confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 51;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Winner Modal Card (#FFF8EF, 28px radius) */
    .winner-modal-card {
      position: relative;
      z-index: 52;
      width: 100%;
      max-width: 760px;
      background-color: var(--color-background);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      padding: clamp(24px, 4vh, 42px) clamp(20px, 4vw, 48px);
      text-align: center;
      transform: scale(0.94) translateY(10px);
      transition: transform 320ms var(--ease-out);
    }

    .modal-overlay.is-open .winner-modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-rose-dark);
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(32px, 4vw, 44px);
      font-weight: 400;
      color: var(--color-primary);
      line-height: 1.12;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: clamp(14px, 1.4vw, 16px);
      color: var(--color-text-secondary);
      margin-bottom: clamp(16px, 2.5vh, 24px);
    }

    /* Inner White Prize Showcase Box */
    .modal-prize-box {
      background-color: var(--color-surface-white);
      border: 1px solid var(--color-border);
      border-radius: 22px;
      padding: clamp(18px, 3vh, 28px);
      margin: 0 auto clamp(18px, 3vh, 28px);
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 20px rgba(38, 48, 39, 0.04);
    }

    .modal-image-square {
      width: clamp(160px, 24vh, 220px);
      height: clamp(160px, 24vh, 220px);
      background-color: var(--color-surface-white);
      border: 1px solid #EFE8DC;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .modal-image-square img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-product-name {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 400;
      color: var(--color-primary);
      margin-bottom: 10px;
    }

    .modal-category-pill {
      display: inline-block;
      background-color: var(--color-surface);
      color: #382B2B;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: var(--radius-pill);
    }

    .modal-cta-btn {
      width: 100%;
      height: clamp(54px, 7vh, 64px);
      border-radius: var(--radius-pill);
      background-color: var(--color-primary);
      color: var(--color-text-inverse);
      border: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(15px, 1.4vw, 17px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-button);
      transition: background-color var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
    }

    .modal-cta-btn:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
    }

    .modal-cta-btn:active {
      transform: scale(0.98);
    }

    /* Responsive adjustments for smaller mobile screens */
    @media (max-width: 640px) {
      .app-shell {
        padding: 64px 12px 14px;
      }
      .game-board {
        padding: 10px;
        border-radius: 22px;
      }
      .reels-row,
      .context-row {
        gap: 8px;
      }
      .product-name {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- Fixed Top Navigation Bar -->
  <header class="top-bar">
    <div class="brand-pill">NAKED NOBLE</div>

    <div class="top-actions">
      <!-- Sound Toggle Button -->
      <button
        id="sound-btn"
        type="button"
        class="icon-btn"
        title="Hang be- és kikapcsolása"
        aria-label="Hang be- és kikapcsolása"
      >
        <svg id="sound-on-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="sound-off-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- Fullscreen Toggle Button -->
      <button
        id="fullscreen-btn"
        type="button"
        class="icon-btn"
        title="Teljes képernyő"
        aria-label="Teljes képernyő"
      >
        <svg id="fs-enter-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="fs-exit-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- FOREGROUND RED START BUTTON OVERLAY -->
  <div id="start-overlay" class="start-overlay">
    <button id="red-start-btn" type="button" class="red-start-btn">
      <span>PÖRGETÉS</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

  <!-- Main Application Container (Starts faded in background behind the Red Button) -->
  <div id="app-shell" class="app-shell is-awaiting-start">

    <!-- Editorial Hero Title -->
    <section class="hero-header">
      <p class="hero-kicker">EGY KIS ÉDESSÉG, EGY NAGY MEGLEPETÉS</p>
      <h1 class="hero-title">Pörgesd ki a szerencséd!</h1>
      <p class="hero-subtitle">Találj három egyforma ajándékot!</p>
    </section>

    <!-- Center Game Board (#F5EBDD) -->
    <main id="game-board" class="game-board" aria-label="Naked Noble nyereményjáték">

      <!-- Top Muted Context Row -->
      <div class="context-row" aria-hidden="true">
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
      </div>

      <!-- Center Row: 3 Large Product Reel Cards -->
      <div class="reels-row">
        <div id="card-0" class="product-card">
          <div id="strip-0" class="reel-strip"></div>
        </div>
        <div id="card-1" class="product-card">
          <div id="strip-1" class="reel-strip"></div>
        </div>
        <div id="card-2" class="product-card">
          <div id="strip-2" class="reel-strip"></div>
        </div>
      </div>

      <!-- Bottom Muted Context Row -->
      <div class="context-row" aria-hidden="true">
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
        <div class="context-slot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </div>
      </div>

    </main>

  </div>

  <!-- Subtle Restrained Confetti Layer (8-10 elements) -->
  <div id="confetti-layer" class="subtle-confetti-container" aria-hidden="true"></div>

  <!-- WINNER MODAL OVERLAY -->
  <div
    id="winner-modal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-heading"
  >
    <div class="winner-modal-card">
      <div class="modal-kicker">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4A53D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"></path>
        </svg>
        <span>GRATULÁLUNK!</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4A53D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"></path>
        </svg>
      </div>

      <h2 id="modal-heading" class="modal-title">Ez édes siker!</h2>
      <p class="modal-subtitle">Megnyerted az alábbi ajándékot:</p>

      <!-- Showcase Card -->
      <div class="modal-prize-box">
        <div class="modal-image-square">
          <img id="modal-prize-img" src="images/kedvezmeny-300.svg" alt="Megnyert ajándék" />
        </div>
        <h3 id="modal-prize-name" class="modal-product-name">300 Ft kedvezmény</h3>
        <span id="modal-prize-category" class="modal-category-pill">GARANTÁLT NYEREMÉNY</span>
      </div>

      <!-- Next Player CTA -->
      <button id="next-player-btn" type="button" class="modal-cta-btn">
        <span>KÖVETKEZŐ JÁTÉKOS</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      // Exact Prize Pool & Probabilities (Total = 100%)
      // 1. kép: Vászontáska – 4%
      // 2. kép: 300 Ft kedvezmény – 51%
      // 3. kép: Golyóstoll – 12%
      // 4. kép: Fakanál – 12%
      // 5. kép: Jojó – 9%
      // 6. kép: Zsebtükör – 9%
      // 7. kép: Karácsonyi sütiformaszett – 3%
      const PRIZES = [
        {
          id: 'kedvezmeny-300',
          name: '300 Ft kedvezmény',
          badge: 'NAKED NOBLE KUPON',
          image: 'images/kedvezmeny-300.svg',
          weight: 51
        },
        {
          id: 'golyostoll',
          name: 'Golyóstoll',
          badge: 'NAKED NOBLE AJÁNDÉK',
          image: 'images/golyostoll.png',
          weight: 12
        },
        {
          id: 'fakanal',
          name: 'Fakanál',
          badge: 'NAKED NOBLE AJÁNDÉK',
          image: 'images/fakanal.jpg',
          weight: 12
        },
        {
          id: 'jojo',
          name: 'Jojó',
          badge: 'NAKED NOBLE AJÁNDÉK',
          image: 'images/jojo.jpg',
          weight: 9
        },
        {
          id: 'zsebtukor',
          name: 'Zsebtükör',
          badge: 'NAKED NOBLE AJÁNDÉK',
          image: 'images/zsebtukor.jpg',
          weight: 9
        },
        {
          id: 'vaszontaska',
          name: 'Vászontáska',
          badge: 'KIEMELT NYEREMÉNY',
          image: 'images/vaszontaska.jpg',
          weight: 4
        },
        {
          id: 'sutiformaszett',
          name: 'Karácsonyi sütiformaszett',
          badge: 'KÜLÖNLEGES NYEREMÉNY',
          image: 'images/sutiformaszett.jpg',
          weight: 3
        }
      ];

      // Weighted Random Selection
      function pickWeightedPrize() {
        const totalWeight = PRIZES.reduce((sum, p) => sum + p.weight, 0);
        let rand = Math.random() * totalWeight;
        for (let i = 0; i < PRIZES.length; i++) {
          if (rand < PRIZES[i].weight) {
            return PRIZES[i];
          }
          rand -= PRIZES[i].weight;
        }
        return PRIZES[0];
      }

      // DOM Elements
      const appShell = document.getElementById('app-shell');
      const startOverlay = document.getElementById('start-overlay');
      const redStartBtn = document.getElementById('red-start-btn');
      const gameBoard = document.getElementById('game-board');
      const cards = [
        document.getElementById('card-0'),
        document.getElementById('card-1'),
        document.getElementById('card-2')
      ];
      const strips = [
        document.getElementById('strip-0'),
        document.getElementById('strip-1'),
        document.getElementById('strip-2')
      ];

      const winnerModal = document.getElementById('winner-modal');
      const modalPrizeImg = document.getElementById('modal-prize-img');
      const modalPrizeName = document.getElementById('modal-prize-name');
      const modalPrizeCategory = document.getElementById('modal-prize-category');
      const nextPlayerBtn = document.getElementById('next-player-btn');
      const confettiLayer = document.getElementById('confetti-layer');

      const soundBtn = document.getElementById('sound-btn');
      const soundOnSvg = document.getElementById('sound-on-svg');
      const soundOffSvg = document.getElementById('sound-off-svg');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const fsEnterSvg = document.getElementById('fs-enter-svg');
      const fsExitSvg = document.getElementById('fs-exit-svg');

      // Pleasant Web Audio Engine
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playSoftClick() {
        if (!soundEnabled || !audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.065);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      }

      function playColumnSettle(stepIndex) {
        if (!soundEnabled || !audioCtx) return;
        const freqs = [392.0, 440.0, 523.25];
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freqs[stepIndex % freqs.length], now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }

      function playElegantWinChime() {
        if (!soundEnabled || !audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const start = audioCtx.currentTime + idx * 0.09;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.linearRampToValueAtTime(0.22, start + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.75);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + 0.75);
        });
      }

      // Top Controls
      soundBtn.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        soundOnSvg.style.display = soundEnabled ? 'block' : 'none';
        soundOffSvg.style.display = soundEnabled ? 'none' : 'block';
        soundBtn.blur();
      });

      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
        fullscreenBtn.blur();
      });

      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        fsEnterSvg.style.display = isFs ? 'none' : 'block';
        fsExitSvg.style.display = isFs ? 'block' : 'none';
      });

      // Reel Strip Setup & Rendering
      const STRIP_ITEMS = 18;
      const TARGET_STOP_INDEX = 15;
      let gameState = 'idle'; // 'idle' | 'spinning' | 'won'
      let currentDisplayedItems = [PRIZES[5], PRIZES[0], PRIZES[2]];

      function getCardHeight() {
        return cards[0].clientHeight;
      }

      function createReelItemNode(prize, heightPx) {
        const item = document.createElement('div');
        item.className = 'reel-item';
        item.style.height = `${heightPx}px`;
        item.innerHTML = `
          <div class="product-image-frame">
            <img src="${prize.image}" alt="${prize.name}" loading="eager" />
          </div>
          <div class="product-name">${prize.name}</div>
        `;
        return item;
      }

      function renderInitialReels() {
        const h = getCardHeight();
        strips.forEach((strip, colIdx) => {
          strip.innerHTML = '';
          strip.style.transition = 'none';
          strip.style.transform = 'translateY(0px)';
          strip.appendChild(createReelItemNode(currentDisplayedItems[colIdx], h));
        });
      }

      requestAnimationFrame(renderInitialReels);

      window.addEventListener('resize', () => {
        const h = getCardHeight();
        document.querySelectorAll('.reel-item').forEach((node) => {
          node.style.height = `${h}px`;
        });
        if (gameState !== 'spinning') {
          strips.forEach((strip) => {
            const itemCount = strip.children.length;
            const targetIdx = itemCount > 1 ? TARGET_STOP_INDEX : 0;
            strip.style.transition = 'none';
            strip.style.transform = `translateY(-${targetIdx * h}px)`;
          });
        }
      });

      // Subtle Restrained Confetti (10 elements for Phase 2)
      function spawnSubtleConfetti() {
        confettiLayer.innerHTML = '';
        const palette = ['#E8B951', '#D98F9D', '#F4AD83', '#B7C5AC', '#173D36'];
        const count = 10;

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          const isCircle = i % 2 === 0;
          const size = isCircle ? 10 + (i % 3) * 4 : 14 + (i % 3) * 4;
          const left = 18 + (i * 6.8) + (Math.random() * 4 - 2);
          const startTop = 25 + (Math.random() * 20);
          const color = palette[i % palette.length];

          el.style.width = `${size}px`;
          el.style.height = isCircle ? `${size}px` : `${size * 0.55}px`;
          el.style.borderRadius = isCircle ? '999px' : '4px';
          el.style.backgroundColor = color;
          el.style.left = `${left}%`;
          el.style.top = `${startTop}%`;

          confettiLayer.appendChild(el);

          const driftX = (Math.random() - 0.5) * 90;
          const fallY = 120 + Math.random() * 140;
          const rot = (Math.random() - 0.5) * 220;

          el.animate(
            [
              { opacity: 0, transform: 'translate(0, -20px) scale(0.6) rotate(0deg)' },
              { opacity: 0.9, transform: `translate(${driftX * 0.4}px, ${fallY * 0.35}px) scale(1) rotate(${rot * 0.5}deg)`, offset: 0.35 },
              { opacity: 0, transform: `translate(${driftX}px, ${fallY}px) scale(0.85) rotate(${rot}deg)` }
            ],
            {
              duration: 1800 + Math.random() * 500,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              fill: 'forwards'
            }
          );
        }
      }

      // Start Spin: Hide Red Button -> Fade in Board -> Spin Reels -> Show Winner Modal
      function startSpin() {
        if (gameState !== 'idle') return;
        initAudio();
        gameState = 'spinning';

        playSoftClick();

        // Hide the Red Start Button and bring the Game Board to full opacity
        startOverlay.classList.add('is-hidden');
        appShell.classList.remove('is-awaiting-start');
        gameBoard.classList.add('is-spinning');
        cards.forEach((c) => c.classList.remove('winning-card'));

        // Weighted prize draw according to exact percentages
        const winningPrize = pickWeightedPrize();
        const h = getCardHeight();

        // Build reel strips
        strips.forEach((strip, colIdx) => {
          strip.innerHTML = '';
          strip.style.transition = 'none';
          strip.style.transform = 'translateY(0px)';

          for (let i = 0; i < STRIP_ITEMS; i++) {
            let itemPrize;
            if (i === 0) {
              itemPrize = currentDisplayedItems[colIdx];
            } else if (i === TARGET_STOP_INDEX) {
              itemPrize = winningPrize;
            } else {
              // Mix all 7 prizes visually during the spin
              itemPrize = PRIZES[(i * 2 + colIdx * 3 + Math.floor(Math.random() * PRIZES.length)) % PRIZES.length];
            }
            strip.appendChild(createReelItemNode(itemPrize, h));
          }
        });

        currentDisplayedItems = [winningPrize, winningPrize, winningPrize];
        void strips[0].offsetHeight;

        const baseDurationMs = 1950;
        const staggerMs = 230;

        strips.forEach((strip, colIdx) => {
          const colDuration = baseDurationMs + colIdx * staggerMs;
          strip.classList.add('motion-blur');
          strip.style.transition = `transform ${colDuration}ms var(--ease-spring)`;
          strip.style.transform = `translateY(-${TARGET_STOP_INDEX * h}px)`;

          setTimeout(() => {
            strip.classList.remove('motion-blur');
            playColumnSettle(colIdx);
          }, colDuration - 160);
        });

        const totalSpinTime = baseDurationMs + 2 * staggerMs;

        // Phase 1: Highlight winning cards
        setTimeout(() => {
          gameBoard.classList.remove('is-spinning');
          cards.forEach((c) => c.classList.add('winning-card'));
          playElegantWinChime();

          // Phase 2 & 3: Open Winner Modal
          setTimeout(() => {
            showWinnerModal(winningPrize);
          }, 550);
        }, totalSpinTime);
      }

      function showWinnerModal(prize) {
        modalPrizeImg.src = prize.image;
        modalPrizeImg.alt = prize.name;
        modalPrizeName.textContent = prize.name;
        modalPrizeCategory.textContent = prize.badge;

        spawnSubtleConfetti();
        winnerModal.classList.add('is-open');
        gameState = 'won';
      }

      // Next Player: Close Winner Modal -> Fade Board -> Bring back Red Start Button on top
      function resetForNextPlayer() {
        if (gameState !== 'won') return;
        playSoftClick();

        winnerModal.classList.remove('is-open');
        confettiLayer.innerHTML = '';
        cards.forEach((c) => c.classList.remove('winning-card'));

        // Fade background board and show the Red Start Button again
        appShell.classList.add('is-awaiting-start');
        startOverlay.classList.remove('is-hidden');
        gameState = 'idle';
      }

      // Event Listeners
      redStartBtn.addEventListener('click', () => {
        redStartBtn.blur();
        startSpin();
      });

      nextPlayerBtn.addEventListener('click', () => {
        nextPlayerBtn.blur();
        resetForNextPlayer();
      });

      // Space & Enter Keyboard Support
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ' || e.key === 'Enter') {
          if (e.repeat) return;
          e.preventDefault();

          if (gameState === 'idle') {
            startSpin();
          } else if (gameState === 'won') {
            resetForNextPlayer();
          }
        }
      });
    })();
  </script>
